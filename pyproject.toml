[project]
name = "bytevoice-bangladesh"
version = "1.0.0"
description = "Bangla AI Voice Receptionist for Dental Clinics & Hospitals in Bangladesh — Powered by FastAPI, WebRTC, and ElevenLabs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Masum Abedin" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bytevoice"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["I", "F", "UP", "E", "W", "B", "SIM"]
ignore = [
    "E501", # line too long handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
